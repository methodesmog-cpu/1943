<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDJ CINE - Chargement...</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300ff88'/%3E%3Cstop offset='100%25' stop-color='%2300803d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%23050505'/%3E%3Cpath d='M20 75 L20 30 L35 30 L50 52 L65 30 L80 30 L80 75 L68 75 L68 47 L55 68 L45 68 L32 47 L32 75 Z' fill='url(%23g)'/%3E%3C/svg%3E">
<meta http-equiv="refresh" content="0; url=/acueil">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  background:#050505;
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(0,255,136,0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(0,128,61,0.15) 0%, transparent 50%);
}
.redirect-container{
  text-align:center;
  animation:fadeIn 0.6s ease-out;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.logo{
  font-family:'Orbitron',sans-serif;
  font-size:48px;
  font-weight:900;
  letter-spacing:6px;
  background:linear-gradient(90deg,#00ff88,#fff,#00ff88,#00803d);
  background-size:300% 100%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 2s linear infinite;
  margin-bottom:25px;
}
@keyframes shine{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
.spinner{
  width:60px;height:60px;
  border-radius:50%;
  border:4px solid rgba(0,255,136,0.2);
  border-top-color:#00ff88;
  animation:spin 1s linear infinite;
  margin:0 auto 20px;
  box-shadow:0 0 30px rgba(0,255,136,0.4);
}
@keyframes spin{to{transform:rotate(360deg);}}
.redirect-text{
  font-size:12px;
  color:#00ff88;
  letter-spacing:4px;
  text-transform:uppercase;
  font-family:'Orbitron',sans-serif;
}
.redirect-sub{
  font-size:11px;
  color:#666;
  letter-spacing:2px;
  margin-top:10px;
}
.redirect-sub a{color:#00ff88;text-decoration:none;font-weight:600;}
.redirect-sub a:hover{text-decoration:underline;}
</style>
<script>
window.location.replace('/acueil');
</script>
</head>
<body>
<div class="redirect-container">
  <div class="logo">MEDJ CINE</div>
  <div class="spinner"></div>
  <div class="redirect-text">Redirection en cours...</div>
  <div class="redirect-sub">Si rien ne se passe, <a href="/acueil">cliquez ici</a></div>
</div>
</body>
</html>
