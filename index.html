<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDJ CINE</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23050505'/%3E%3Cpath d='M20 75 L20 30 L35 30 L50 52 L65 30 L80 30 L80 75 L68 75 L68 47 L55 68 L45 68 L32 47 L32 75 Z' fill='%2300ff88'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23050505'/%3E%3Cpath d='M20 75 L20 30 L35 30 L50 52 L65 30 L80 30 L80 75 L68 75 L68 47 L55 68 L45 68 L32 47 L32 75 Z' fill='%2300ff88'/%3E%3C/svg%3E">
<meta name="theme-color" content="#00ff88">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#00ff88;--primary-dark:#00803d;--primary-deep:#004d24;--gradient:linear-gradient(135deg,#00ff88 0%,#00803d 50%,#004d24 100%);--accent-glow:0 0 30px rgba(0,255,136,0.6);--bg-dark:#050505;--card-bg:#111;--text-light:#fff;--theme-rgb:0,255,136;--particle-bg:radial-gradient(ellipse at top,#0a2a1a 0%,#050505 70%);}
body[data-theme="blue"]{--primary:#00b4ff;--primary-dark:#005fa3;--primary-deep:#003d6b;--gradient:linear-gradient(135deg,#00b4ff,#005fa3,#003d6b);--theme-rgb:0,180,255;--particle-bg:radial-gradient(ellipse at top,#0a1a2a,#050505 70%);}
body[data-theme="purple"]{--primary:#a855f7;--primary-dark:#6b21a8;--primary-deep:#4c1d95;--gradient:linear-gradient(135deg,#a855f7,#6b21a8,#4c1d95);--theme-rgb:168,85,247;--particle-bg:radial-gradient(ellipse at top,#1a0a2a,#050505 70%);}
body[data-theme="red"]{--primary:#ff2d55;--primary-dark:#8b0020;--primary-deep:#5c0015;--gradient:linear-gradient(135deg,#ff2d55,#8b0020,#5c0015);--theme-rgb:255,45,85;--particle-bg:radial-gradient(ellipse at top,#2a0a10,#050505 70%);}
body[data-theme="orange"]{--primary:#ff9500;--primary-dark:#b36600;--primary-deep:#804700;--gradient:linear-gradient(135deg,#ff9500,#b36600,#804700);--theme-rgb:255,149,0;--particle-bg:radial-gradient(ellipse at top,#2a1800,#050505 70%);}
body[data-theme="pink"]{--primary:#ff2d92;--primary-dark:#a30059;--primary-deep:#6b003a;--gradient:linear-gradient(135deg,#ff2d92,#a30059,#6b003a);--theme-rgb:255,45,146;--particle-bg:radial-gradient(ellipse at top,#2a0a1a,#050505 70%);}
body[data-theme="cyan"]{--primary:#00e5ff;--primary-dark:#0097a7;--primary-deep:#006064;--gradient:linear-gradient(135deg,#00e5ff,#0097a7,#006064);--theme-rgb:0,229,255;--particle-bg:radial-gradient(ellipse at top,#0a1e2a,#050505 70%);}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
html{scroll-behavior:smooth;}
body{background:var(--bg-dark);color:var(--text-light);overflow-x:hidden;min-height:100vh;}
.cursor-glow{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(var(--theme-rgb),0.15),transparent 70%);pointer-events:none;transform:translate(-50%,-50%);z-index:9998;transition:0.15s;}
#particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:var(--particle-bg);overflow:hidden;}
.particle{position:absolute;background:var(--primary);border-radius:50%;opacity:0.4;animation:float linear infinite;filter:blur(1px);}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0;}10%{opacity:0.6;}90%{opacity:0.6;}100%{transform:translateY(-10vh) scale(1);opacity:0;}}
.logo{font-family:'Orbitron',sans-serif;font-size:30px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,var(--primary),#fff,var(--primary),var(--primary-dark));background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3s linear infinite;cursor:pointer;}
@keyframes shine{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
header{position:fixed;top:0;width:100%;padding:15px 50px;display:flex;justify-content:space-between;align-items:center;background:rgba(5,5,5,0.85);backdrop-filter:blur(15px);z-index:1000;border-bottom:1px solid rgba(var(--theme-rgb),0.2);}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.theme-picker{position:relative;display:flex;align-items:center;justify-content:center;}
.theme-toggle{width:48px;height:48px;border:2px solid rgba(255,255,255,.8);border-radius:50%;cursor:pointer;background:conic-gradient(#00ff88,#00b4ff,#a855f7,#ff2d55,#ff9500,#ff2d92,#00e5ff,#00ff88);box-shadow:0 0 22px rgba(var(--theme-rgb),.6);position:relative;transition:.3s;outline:none;}
.theme-toggle:hover{transform:scale(1.12) rotate(15deg);}
.theme-toggle::after{content:'🎨';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;pointer-events:none;}
.theme-options{display:none;position:absolute;top:58px;right:0;gap:12px;padding:14px 16px;background:rgba(12,12,12,.98);border:1px solid rgba(var(--theme-rgb),.6);border-radius:22px;z-index:2000;backdrop-filter:blur(20px);}
.theme-picker.open .theme-options{display:flex;}
.theme-dot{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid rgba(255,255,255,.3);cursor:pointer;transition:.25s;background:var(--dot-color);position:relative;outline:none;}
.theme-dot:hover,.theme-dot.active{transform:scale(1.28);border-color:#fff;}
.theme-dot.active::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;text-shadow:0 1px 4px #000;}
.theme-dot[data-theme-choice="green"]{--dot-color:#00ff88;}
.theme-dot[data-theme-choice="blue"]{--dot-color:#00b4ff;}
.theme-dot[data-theme-choice="purple"]{--dot-color:#a855f7;}
.theme-dot[data-theme-choice="red"]{--dot-color:#ff2d55;}
.theme-dot[data-theme-choice="orange"]{--dot-color:#ff9500;}
.theme-dot[data-theme-choice="pink"]{--dot-color:#ff2d92;}
.theme-dot[data-theme-choice="cyan"]{--dot-color:#00e5ff;}
.btn-header{padding:10px 18px;border-radius:50px;font-size:12px;font-weight:600;transition:.3s;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-family:'Poppins',sans-serif;background:transparent;border:2px solid var(--primary);color:var(--primary);text-decoration:none;}
.btn-header:hover{background:var(--primary);color:#000;box-shadow:var(--accent-glow);transform:translateY(-2px);}
.btn-header.sound{width:42px;height:42px;padding:0;justify-content:center;border-radius:50%;}

.hero-banner{margin-top:70px;position:relative;overflow:hidden;padding:0;width:100%;height:100vh;min-height:600px;max-height:900px;}
.hero-slider{position:relative;width:100%;height:100%;overflow:hidden;}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease-in-out;z-index:1;}
.slide.active{opacity:1;z-index:2;}
.slide-bg-stack{position:absolute;inset:0;overflow:hidden;}
.slide-bg-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center 25%;opacity:0;transition:opacity 1.2s;will-change:opacity;}
.slide-bg-img.active{opacity:1;animation:kenBurns 9s ease-out forwards;}
@keyframes kenBurns{0%{transform:scale(1);}100%{transform:scale(1.08);}}
.slide::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(5,5,5,1) 0%,rgba(5,5,5,.85) 22%,rgba(5,5,5,.45) 50%,rgba(5,5,5,.15) 75%,rgba(5,5,5,.3) 100%);z-index:2;pointer-events:none;}
.slide-content{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:60px 70px;max-width:820px;animation:fadeUp .9s cubic-bezier(0.16,1,0.3,1);}
.badge-type{display:inline-block;padding:6px 16px;background:rgba(0,0,0,.6);border:1px solid var(--primary);border-radius:50px;font-size:11px;font-weight:700;letter-spacing:3px;color:var(--primary);text-transform:uppercase;margin-bottom:16px;backdrop-filter:blur(10px);}
.slide-content h2{font-family:'Orbitron',sans-serif;font-size:56px;font-weight:900;letter-spacing:3px;line-height:1.05;text-shadow:0 2px 20px rgba(0,0,0,.9),0 4px 40px rgba(0,0,0,.7);margin-bottom:16px;}
.slide-meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px;font-size:13px;color:#e0e0e0;font-weight:600;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.9);}
.slide-meta .quality-badge{position:static;padding:4px 10px;border-radius:6px;font-size:10px;}
.slide-desc{font-size:14px;color:#d0d0d0;line-height:1.6;margin-bottom:24px;max-width:600px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 8px rgba(0,0,0,.9);}
.hero-cta{display:inline-flex;gap:15px;flex-wrap:wrap;}
.hero-cta button{padding:14px 32px;background:rgba(0,0,0,.65);border:2px solid var(--primary);color:var(--primary);font-weight:600;letter-spacing:2px;border-radius:50px;cursor:pointer;transition:.4s;font-family:'Poppins',sans-serif;font-size:13px;backdrop-filter:blur(10px);display:inline-flex;align-items:center;gap:10px;}
.hero-cta button:hover{background:var(--primary);color:#000;box-shadow:0 10px 40px rgba(var(--theme-rgb),.7);transform:translateY(-3px) scale(1.05);}
.hero-cta button.primary{background:var(--primary);color:#000;box-shadow:0 5px 30px rgba(var(--theme-rgb),.5);}
.slider-nav{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.65);border:2px solid var(--primary);color:var(--primary);font-size:20px;cursor:pointer;z-index:10;transition:.3s;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);}
.slider-nav:hover{background:var(--primary);color:#000;transform:translateY(-50%) scale(1.1);}
.slider-nav.prev{left:22px;}
.slider-nav.next{right:22px;}
.slider-dots{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;padding:8px 14px;background:rgba(0,0,0,.4);border-radius:50px;backdrop-filter:blur(10px);}
.slider-dots .dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.3);border:none;cursor:pointer;transition:.3s;}
.slider-dots .dot.active{background:var(--primary);width:38px;border-radius:50px;}

.platforms-bar,.search-section,.genres-section{padding:25px 50px;background:rgba(10,10,10,.9);backdrop-filter:blur(15px);border-bottom:1px solid rgba(var(--theme-rgb),.15);}
.section-label{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--primary);letter-spacing:3px;text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:12px;}
.section-label::before{content:'';width:4px;height:20px;background:var(--gradient);border-radius:5px;}
.platforms-row{display:flex;gap:15px;flex-wrap:wrap;}
.platform-chip{display:flex;align-items:center;gap:14px;padding:12px 22px 12px 12px;background:rgba(20,20,20,.9);border:1px solid rgba(var(--theme-rgb),.2);border-radius:50px;color:#ccc;cursor:pointer;transition:.4s;font-size:15px;font-weight:600;position:relative;overflow:hidden;}
.platform-chip::before{content:'';position:absolute;left:-100%;top:0;width:100%;height:100%;background:var(--gradient);transition:.4s;z-index:-1;}
.platform-chip:hover,.platform-chip.active{color:#000;font-weight:700;border-color:var(--primary);transform:translateY(-3px);}
.platform-chip:hover::before,.platform-chip.active::before{left:0;}
.platform-logo{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;padding:8px;flex-shrink:0;border:2px solid rgba(var(--theme-rgb),.4);overflow:hidden;}
.platform-logo img{width:100%;height:100%;object-fit:contain;display:block;}
.platform-chip .count{font-size:12px;background:rgba(var(--theme-rgb),.2);color:var(--primary);padding:3px 10px;border-radius:20px;font-weight:700;}
.search-row{display:flex;gap:15px;flex-wrap:wrap;align-items:center;}
.search-box{flex:1;min-width:250px;position:relative;}
.search-box input{width:100%;padding:15px 50px 15px 22px;border-radius:50px;border:1px solid #333;background:#111;color:white;outline:none;transition:.4s;font-size:14px;}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 25px rgba(var(--theme-rgb),.4);}
.search-box i{position:absolute;right:22px;top:50%;transform:translateY(-50%);color:var(--primary);}
select{padding:15px 22px;border-radius:50px;border:1px solid #333;background:#111;color:white;cursor:pointer;outline:none;transition:.3s;font-size:14px;min-width:170px;}
select:hover,select:focus{border-color:var(--primary);}
.genres-row{display:flex;gap:12px;flex-wrap:wrap;}
.genre-btn{display:flex;align-items:center;gap:10px;padding:12px 24px;background:rgba(20,20,20,.9);border:1px solid rgba(var(--theme-rgb),.2);border-radius:50px;color:#ccc;cursor:pointer;transition:.4s;font-size:13px;font-weight:500;position:relative;overflow:hidden;}
.genre-btn::before{content:'';position:absolute;left:-100%;top:0;width:100%;height:100%;background:var(--gradient);transition:.4s;z-index:-1;}
.genre-btn:hover,.genre-btn.active{color:#000;font-weight:700;border-color:var(--primary);transform:translateY(-3px);}
.genre-btn:hover::before,.genre-btn.active::before{left:0;}
.main-zone{padding:35px 50px;}
.zone-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;margin-bottom:25px;}
.zone-title{font-family:'Orbitron',sans-serif;font-size:22px;color:var(--primary);letter-spacing:3px;display:flex;align-items:center;gap:12px;}
.zone-title::before{content:'';width:5px;height:30px;background:var(--gradient);border-radius:5px;}
.zone-count{font-size:12px;color:#888;}
.movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px;}
.movie-card{background:var(--card-bg);border-radius:15px;overflow:hidden;cursor:pointer;transition:all .5s;border:1px solid #222;display:flex;flex-direction:column;position:relative;}
.movie-card:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 20px 40px rgba(var(--theme-rgb),.3),0 0 0 1px var(--primary);}
.poster-wrap{position:relative;overflow:hidden;aspect-ratio:2/3;background:#0a0a0a;}
.movie-poster{width:100%;height:100%;object-fit:cover;transition:transform .5s,filter .5s;display:block;}
.movie-card:hover .movie-poster{transform:scale(1.1);filter:brightness(.5);}
.quality-badge{position:absolute;top:10px;right:10px;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:900;font-family:'Orbitron',sans-serif;z-index:3;backdrop-filter:blur(10px);border:2px solid;}
.q-4k{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;border-color:#fff;}
.q-hd{background:var(--gradient);color:#fff;border-color:rgba(255,255,255,.5);}
.q-sd{background:linear-gradient(135deg,#888,#444);color:#fff;border-color:rgba(255,255,255,.3);}
.q-hdr{background:linear-gradient(135deg,#a855f7,#6b21a8);color:#fff;border-color:#d8b4fe;}
.type-badge{position:absolute;top:10px;left:10px;padding:5px 10px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:rgba(0,0,0,.7);color:var(--primary);border:1px solid var(--primary);z-index:3;}
.movie-card .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.95) 0%,transparent 70%);opacity:0;transition:.4s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:4;padding:15px;}
.movie-card:hover .overlay{opacity:1;}
.action-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:50px;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;border:none;transition:.3s;width:100%;max-width:160px;text-transform:uppercase;transform:translateY(20px);opacity:0;}
.movie-card:hover .action-btn{transform:translateY(0);opacity:1;}
.btn-watch{background:var(--gradient);color:#000;}
.btn-trailer{background:linear-gradient(135deg,#ff0000,#8b0000);color:#fff;}
.btn-download{background:rgba(0,0,0,.7);color:var(--primary);border:2px solid var(--primary);}
.movie-info{padding:14px 12px;text-align:center;background:var(--card-bg);}
.movie-info h4{font-size:13px;margin-bottom:6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;}
.movie-info .meta{display:flex;justify-content:center;align-items:center;gap:6px;font-size:10px;color:#888;letter-spacing:1px;flex-wrap:wrap;}
.platform-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.tag-netflix{background:rgba(229,9,20,.2);color:#e50914;}
.tag-prime{background:rgba(0,168,225,.2);color:#00a8e1;}
.tag-disney{background:rgba(0,99,229,.2);color:#0063e5;}
.tag-autre{background:rgba(136,136,136,.2);color:#888;}
.empty-state{text-align:center;padding:80px 20px;color:#666;grid-column:1/-1;}
.empty-state i{font-size:60px;color:var(--primary);opacity:.3;margin-bottom:20px;display:block;}
.empty-state h3{font-family:'Orbitron',sans-serif;color:var(--primary);margin-bottom:12px;}

/* ═══ PAGINATION ═══ */
.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:35px;
  flex-wrap:wrap;
  padding:20px;
  background:rgba(15,15,15,0.6);
  border-radius:15px;
  border:1px solid rgba(var(--theme-rgb),0.25);
  backdrop-filter:blur(10px);
}
.pagination button{
  min-width:44px;
  height:44px;
  padding:0 16px;
  border-radius:10px;
  border:1px solid #333;
  background:rgba(0,0,0,0.5);
  color:#aaa;
  cursor:pointer;
  font-weight:600;
  font-family:'Poppins',sans-serif;
  font-size:14px;
  transition:0.3s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.pagination button:hover:not(:disabled){
  border-color:var(--primary);
  color:var(--primary);
  transform:translateY(-2px);
  box-shadow:0 5px 15px rgba(var(--theme-rgb),0.35);
}
.pagination button.active{
  background:var(--gradient);
  color:#000;
  border-color:var(--primary);
  box-shadow:0 0 20px rgba(var(--theme-rgb),0.6);
  font-weight:700;
}
.pagination button:disabled{
  opacity:0.3;
  cursor:not-allowed;
}
.pagination .page-info{
  color:#888;
  font-size:12px;
  letter-spacing:1px;
  margin:0 10px;
  font-family:'Orbitron',sans-serif;
}
.pagination .dots{
  color:var(--primary);
  padding:0 5px;
  user-select:none;
  font-weight:900;
}

footer{text-align:center;padding:40px 20px;margin-top:30px;border-top:1px solid rgba(var(--theme-rgb),.2);}
.signature{font-size:18px;font-family:'Orbitron',sans-serif;letter-spacing:3px;color:var(--primary);font-weight:700;margin-bottom:10px;}
footer p{color:#666;font-size:12px;letter-spacing:2px;}
.toast{position:fixed;bottom:30px;left:30px;background:var(--gradient);color:#000;padding:15px 25px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(var(--theme-rgb),.5);transform:translateX(-200%);transition:.5s;z-index:99999;max-width:90vw;}
.toast.show{transform:translateX(0);}
.toast.error{background:linear-gradient(135deg,#ff2d55,#8b0020);color:#fff;}
.video-modal{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(15px);}
.video-modal.show{display:flex;}
.video-container{width:100%;max-width:1200px;background:#000;border-radius:15px;overflow:hidden;border:2px solid var(--primary);max-height:95vh;display:flex;flex-direction:column;}
.video-header{padding:15px 20px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);display:flex;justify-content:space-between;align-items:center;color:#fff;}
.video-header h3{font-family:'Orbitron',sans-serif;font-size:18px;letter-spacing:2px;}
.video-close{width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,45,85,.9);color:#fff;cursor:pointer;font-size:18px;transition:.3s;}
.video-close:hover{transform:rotate(90deg);}
.video-player{width:100%;aspect-ratio:16/9;background:#000;flex-shrink:0;}
.video-player iframe,.video-player video{width:100%;height:100%;border:none;display:block;}
.loading{position:fixed;inset:0;background:rgba(5,5,5,.95);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;}
.loading.hidden{display:none;}
.spinner{width:60px;height:60px;border-radius:50%;border:4px solid rgba(var(--theme-rgb),.2);border-top-color:var(--primary);animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-family:'Orbitron',sans-serif;font-size:14px;color:var(--primary);letter-spacing:4px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(60px);}to{opacity:1;transform:translateY(0);}}

function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type){
  if(!soundEnabled) return;
  try{
    initAudio();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if(type === 'click'){ osc.type='sine'; osc.frequency.setValueAtTime(880,now); osc.frequency.exponentialRampToValueAtTime(440,now+0.15); gain.gain.setValueAtTime(0.1,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.15); osc.start(now); osc.stop(now+0.15); }
    else if(type === 'hover'){ osc.type='sine'; osc.frequency.setValueAtTime(1200,now); gain.gain.setValueAtTime(0.03,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.08); osc.start(now); osc.stop(now+0.08); }
  }catch(e){}
}
function toggleSound(){
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundToggle');
  btn.innerHTML = soundEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
  showToast(soundEnabled ? '🔊 Son activé' : '🔇 Son désactivé');

function showToast(msg, isError=false){

}

function waitForFB(){
  return new Promise(resolve => {
    if(window.FB) return resolve();
    window.addEventListener('fb-ready', () => resolve());
  });
}

function startMoviesListener(){
  if(unsubscribeMovies) unsubscribeMovies();
  const q = window.FB.query(window.FB.collection(window.FB.db, 'movies'), window.FB.orderBy('id', 'asc'));
  unsubscribeMovies = window.FB.onSnapshot(q, (snapshot) => {
    allMovies = [];
    snapshot.forEach(doc => allMovies.push({ firestoreId: doc.id, ...doc.data() }));
    renderPlatformButtons();
    renderMovies();
  }, (err) => console.error(err));
}

function buildSlider() {
  featuredMovies = FEATURED_MOVIES;
  const slider = document.getElementById('heroSlider');
  const dotsContainer = document.getElementById('sliderDots');
  if (!slider || !dotsContainer) return;

  slider.innerHTML = '';
  dotsContainer.innerHTML = '';

  featuredMovies.forEach((movie, index) => {
    const q = qualityConfig[movie.quality] || qualityConfig['hd'];
    const slide = document.createElement('div');
    slide.className = 'slide' + (index === 0 ? ' active' : '');
    slide.dataset.slideIndex = index;

    slide.innerHTML = `
      <div class="slide-bg-stack">
        <img class="slide-bg-img active" src="${movie.img}" alt="${movie.title}" loading="${index === 0 ? 'eager' : 'lazy'}" onerror="this.style.background='linear-gradient(135deg,#004d24,#00ff88)';this.removeAttribute('src');">
      </div>
      <div class="slide-content">
        <span class="badge-type">${movie.type === 'film' ? '🎬 FILM' : '📺 SÉRIE'}</span>
        <h2>${movie.title}</h2>
        <div class="slide-meta">
          <span>${movie.year}</span>
          <span>•</span>
          <span class="quality-badge ${q.class}">${q.text}</span>
          <span>•</span>
          <span>${(movie.platform || 'autre').toUpperCase()}</span>
        </div>
        <p class="slide-desc">${movie.description}</p>
        <div class="hero-cta">
          <button class="primary" onclick="playMovieById('${movie.id}')"><i class="fas fa-play"></i> REGARDER</button>
          ${movie.trailerUrl ? `<button onclick="playTrailer('${movie.id}')"><i class="fas fa-film"></i> BANDE-ANNONCE</button>` : ''}
        </div>
      </div>
    `;
    slider.appendChild(slide);

    const dot = document.createElement('button');
    dot.className = 'dot' + (index === 0 ? ' active' : '');
    dot.addEventListener('click', () => { playSound('click'); goToSlide(index); restartAutoSlide(); });
    dotsContainer.appendChild(dot);
  });

  currentSlide = 0;
  startAutoSlide();
}

function goToSlide(index) {
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.slider-dots .dot');
  if (slides.length === 0) return;
  if (index >= slides.length) index = 0;
  if (index < 0) index = slides.length - 1;
  slides.forEach((s, i) => s.classList.toggle('active', i === index));
  dots.forEach((d, i) => d.classList.toggle('active', i === index));
  currentSlide = index;
}

function changeSlide(direction) {
  playSound('click');
  goToSlide(currentSlide + direction);
  restartAutoSlide();
}

function startAutoSlide() {
  stopAutoSlide();
  slideInterval = setInterval(() => goToSlide(currentSlide + 1), 6000);
}
function stopAutoSlide() { if (slideInterval) clearInterval(slideInterval); }
function restartAutoSlide() { stopAutoSlide(); startAutoSlide(); }

document.getElementById('heroSlider')?.addEventListener('mouseenter', stopAutoSlide);
document.getElementById('heroSlider')?.addEventListener('mouseleave', startAutoSlide);

function renderPlatformButtons(){
  const row = document.getElementById('platformsRow');
  if(!row) return;
  row.innerHTML = '';
  platforms.forEach(p => {
    let count = 0;
    if(p.id === 'all') count = allMovies.length;
    else if(p.id === 'autre') count = allMovies.filter(m => !m.platform || m.platform === 'autre').length;
    else count = allMovies.filter(m => m.platform === p.id).length;
    const btn = document.createElement('button');
    btn.className = 'platform-chip' + (currentPlatform === p.id ? ' active' : '');
    btn.dataset.id = p.id;
    btn.innerHTML = `<div class="platform-logo"><img src="${p.logo}" alt="${p.name}" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\\'fas fa-tv\\' style=\\'color:var(--primary);font-size:20px;\\'></i>'"></div><span>${p.name}</span><span class="count">${count}</span>`;
    btn.addEventListener('mouseenter', () => playSound('hover'));
    btn.addEventListener('click', () => selectPlatform(p.id));
    row.appendChild(btn);
  });
}

function renderGenreButtons(){
  const row = document.getElementById('genresRow');
  if(!row) return;
  row.innerHTML = '';
  GENRES.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'genre-btn' + (g.id === 'all' ? ' active' : '');
    btn.dataset.genre = g.id;
    btn.innerHTML = `<i class="fas ${g.icon}"></i> ${g.label}`;
    btn.addEventListener('mouseenter', () => playSound('hover'));
    btn.addEventListener('click', () => selectGenre(g.id));
    row.appendChild(btn);
  });
}

function selectPlatform(id){
  playSound('click');
  currentPlatform = id; currentGenre = 'all'; currentType = 'all';
  currentPage = 1;
  document.querySelectorAll('.platform-chip').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  document.querySelectorAll('.genre-btn').forEach(b => b.classList.toggle('active', b.dataset.genre === 'all'));
  renderMovies();
}

function selectGenre(genre){
  playSound('click');
  currentPage = 1;
  currentGenre = genre;
  if(genre === 'film'){ currentType = 'film'; currentGenre = 'all'; }
  else if(genre === 'serie'){ currentType = 'serie'; currentGenre = 'all'; }
  else { currentType = 'all'; if(genre !== 'all') currentGenre = genre; }
  document.querySelectorAll('.platform-chip').forEach(b => b.classList.toggle('active', b.dataset.id === 'all'));
  document.querySelectorAll('.genre-btn').forEach(b => b.classList.toggle('active', b.dataset.genre === genre));
  renderMovies();
}

function resetFilters(){
  playSound('click');
  currentPlatform = 'all'; currentYear = 'all'; currentType = 'all'; currentGenre = 'all'; currentQuality = 'all'; currentSearch = ''; currentSort = 'default';
  currentPage = 1;
  document.getElementById('searchInput').value = '';
  document.getElementById('yearFilter').value = 'all';
  document.getElementById('qualityFilter').value = 'all';
  document.getElementById('sortFilter').value = 'default';
  renderPlatformButtons();
  document.querySelectorAll('.genre-btn').forEach(b => b.classList.toggle('active', b.dataset.genre === 'all'));
  renderMovies();
}

function renderMovies(){
  const grid = document.getElementById('movieGrid');
  const zoneTitle = document.getElementById('zoneTitle');
  const zoneCount = document.getElementById('zoneCount');
  if(!grid) return;
  grid.innerHTML = '';

  let list = [...allMovies];
  if(currentPlatform !== 'all'){
    if(currentPlatform === 'autre') list = list.filter(m => !m.platform || m.platform === 'autre');
    else list = list.filter(m => m.platform === currentPlatform);
  }
  if(currentType !== 'all') list = list.filter(m => m.type === currentType);
  if(currentGenre !== 'all') list = list.filter(m => m.genre === currentGenre);

  const platformName = platforms.find(p => p.id === currentPlatform)?.name || 'Tous';
  let titleText = currentPlatform === 'all' ? 'TOUS LES CONTENUS' : platformName.toUpperCase();
  if(currentType === 'film') titleText = '🎥 ' + (currentPlatform === 'all' ? 'TOUS LES FILMS' : 'FILMS ' + platformName.toUpperCase());
  if(currentType === 'serie') titleText = '📺 ' + (currentPlatform === 'all' ? 'TOUTES LES SÉRIES' : 'SÉRIES ' + platformName.toUpperCase());
  zoneTitle.textContent = titleText;

  if(currentYear !== 'all') list = list.filter(m => m.year == currentYear);
  if(currentQuality !== 'all') list = list.filter(m => m.quality === currentQuality);
  if(currentSearch) list = list.filter(m => m.title.toLowerCase().includes(currentSearch.toLowerCase()));

  if(currentSort === 'recent') list.sort((a,b) => b.year - a.year);
  else if(currentSort === 'old') list.sort((a,b) => a.year - b.year);
  else if(currentSort === 'az') list.sort((a,b) => a.title.localeCompare(b.title));
  else if(currentSort === 'za') list.sort((a,b) => b.title.localeCompare(a.title));

  filteredList = list;
  const totalPages = Math.ceil(filteredList.length / ITEMS_PER_PAGE) || 1;

  if(currentPage > totalPages) currentPage = totalPages;
  if(currentPage < 1) currentPage = 1;

  const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
  const endIndex = startIndex + ITEMS_PER_PAGE;
  const pageMovies = filteredList.slice(startIndex, endIndex);

  zoneCount.textContent = list.length + ' résultat' + (list.length > 1 ? 's' : '');

  if(list.length === 0){
    grid.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><h3>AUCUN RÉSULTAT</h3><p>Aucun contenu ne correspond à vos filtres.</p></div>';
    renderPagination(0);
    return;
  }

  pageMovies.forEach((movie, i) => {
    const q = qualityConfig[movie.quality] || qualityConfig['hd'];
    const platformId = movie.platform || 'autre';
    const card = document.createElement('div');
    card.className = 'movie-card';
    card.style.animation = `fadeUp 0.5s ${i * 0.03}s backwards`;
    card.innerHTML = `
      <div class="poster-wrap">
        <img src="${movie.img}" alt="${movie.title}" class="movie-poster" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450/333/fff?text=No+Image'">
        <div class="quality-badge ${q.class}">${q.text}</div>
        <div class="type-badge">${movie.type === 'film' ? '🎬 FILM' : '📺 SÉRIE'}</div>
        <div class="overlay">
          <button class="action-btn btn-watch" onclick="event.stopPropagation();playMovieById(${movie.id})"><i class="fas fa-play"></i> REGARDER</button>
          <button class="action-btn btn-download" onclick="event.stopPropagation();downloadMovie(${movie.id})"><i class="fas fa-download"></i> TÉLÉCHARGER</button>
        </div>
      </div>
      <div class="movie-info">
        <h4>${movie.title}</h4>
        <div class="meta"><span>${movie.year}</span><span>•</span><span class="platform-tag tag-${platformId}">${platformId}</span></div>
      </div>
    `;
    card.addEventListener('mouseenter', () => playSound('hover'));
    grid.appendChild(card);
  });

  renderPagination(totalPages);
}

/* ═══ FONCTIONS DE PAGINATION ═══ */
function renderPagination(totalPages){
  const container = document.getElementById('pagination');
  if(!container) return;
  container.innerHTML = '';

  if(totalPages <= 1){
    if(filteredList.length > 0){
      container.innerHTML = `<div class="page-info">
        ${filteredList.length} contenu${filteredList.length>1?'s':''} · Page 1/1
      </div>`;
    }
    return;
  }

  const prevBtn = document.createElement('button');
  prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
  prevBtn.disabled = currentPage === 1;
  prevBtn.onclick = () => goToPage(currentPage - 1);
  container.appendChild(prevBtn);

  const pages = getPageNumbers(currentPage, totalPages);

  pages.forEach(p => {
    if(p === '...'){
      const dots = document.createElement('span');
      dots.className = 'dots';
      dots.textContent = '…';
      container.appendChild(dots);
    } else {
      const btn = document.createElement('button');
      btn.textContent = p;
      if(p === currentPage) btn.classList.add('active');
      btn.onclick = () => goToPage(p);
      container.appendChild(btn);
    }
  });

  const nextBtn = document.createElement('button');
  nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.onclick = () => goToPage(currentPage + 1);
  container.appendChild(nextBtn);

  const info = document.createElement('div');
  info.className = 'page-info';
  info.textContent = `${filteredList.length} contenus · Page ${currentPage}/${totalPages}`;
  container.appendChild(info);
}

function getPageNumbers(current, total){
  const delta = 2;
  const range = [];
  const rangeWithDots = [];
  let l;

  for(let i = 1; i <= total; i++){
    if(i === 1 || i === total || (i >= current - delta && i <= current + delta)){
      range.push(i);
    }
  }

  for(let i of range){
    if(l){
      if(i - l === 2){
        rangeWithDots.push(l + 1);
      } else if(i - l !== 1){
        rangeWithDots.push('...');
      }
    }
    rangeWithDots.push(i);
    l = i;
  }
  return rangeWithDots;
}

function goToPage(page){
  currentPage = page;
  renderMovies();
  const mainZone = document.querySelector('.main-zone');
  if(mainZone){
    const y = mainZone.getBoundingClientRect().top + window.pageYOffset - 100;
    window.scrollTo({top:y, behavior:'smooth'});
  }
}

function playMovieById(id){
  const movie = allMovies.find(m => m.id === id) || FEATURED_MOVIES.find(m => m.id === id);
  if(!movie) return;
  if(!movie.streamUrl){ showToast('⚠️ Aucun lien disponible pour ' + movie.title, true); return; }
  playSound('click');
  document.getElementById('videoTitle').textContent = movie.title;
  const wrap = document.getElementById('videoPlayer');
  const url = movie.streamUrl;
  if(url.includes('youtube.com/watch') || url.includes('youtu.be/')){
    const vid = url.includes('watch') ? new URLSearchParams(url.split('?')[1]).get('v') : url.split('youtu.be/')[1].split('?')[0];
    wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1" allow="autoplay" allowfullscreen></iframe>`;
  } else {
    wrap.innerHTML = `<video src="${url}" controls autoplay style="width:100%;height:100%;"></video>`;
  }
  document.getElementById('videoModal').classList.add('show');
}

function playTrailer(id){
  const movie = allMovies.find(m => m.id === id) || FEATURED_MOVIES.find(m => m.id === id);
  if(!movie || !movie.trailerUrl){ showToast('⚠️ Pas de bande-annonce', true); return; }
  playSound('click');
  document.getElementById('videoTitle').textContent = '🎬 Bande-annonce - ' + movie.title;
  const wrap = document.getElementById('videoPlayer');
  const url = movie.trailerUrl;
  let vid = null;
  if(url.includes('youtube.com/watch')) vid = new URLSearchParams(url.split('?')[1]).get('v');
  else if(url.includes('youtu.be/')) vid = url.split('youtu.be/')[1].split('?')[0];
  if(vid) wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1" allow="autoplay" allowfullscreen></iframe>`;
  document.getElementById('videoModal').classList.add('show');
}

function closeVideo(){
  document.getElementById('videoModal').classList.remove('show');
  document.getElementById('videoPlayer').innerHTML = '';
}

document.getElementById('videoModal').addEventListener('click', e => { if(e.target.id === 'videoModal') closeVideo(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeVideo();
  if(e.key === 'ArrowLeft') changeSlide(-1);
  if(e.key === 'ArrowRight') changeSlide(1);
});

function downloadMovie(id){
  const movie = allMovies.find(m => m.id === id) || FEATURED_MOVIES.find(m => m.id === id);
  if(!movie) return;
  playSound('click');
  showToast('⬇️ Téléchargement : ' + movie.title);
}

document.getElementById('searchInput').addEventListener('input', e => { currentSearch = e.target.value; currentPage = 1; renderMovies(); });
document.getElementById('yearFilter').addEventListener('change', e => { currentYear = e.target.value; currentPage = 1; renderMovies(); });
document.getElementById('qualityFilter').addEventListener('change', e => { currentQuality = e.target.value; currentPage = 1; renderMovies(); });
document.getElementById('sortFilter').addEventListener('change', e => { currentSort = e.target.value; currentPage = 1; renderMovies(); });

function setTheme(theme){
  if(theme === 'green') document.body.removeAttribute('data-theme');
  else document.body.dataset.theme = theme;
  document.querySelectorAll('.theme-dot').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.themeChoice === theme);
  });
  showToast('🎨 Thème appliqué');
}
const themePicker = document.getElementById('themePicker');
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  themePicker.classList.toggle('open');
  playSound('click');
});
document.querySelectorAll('.theme-dot').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    playSound('click');
    setTheme(btn.dataset.themeChoice);
    themePicker.classList.remove('open');
  });
});
document.addEventListener('click', event => {
  if (!themePicker.contains(event.target)) themePicker.classList.remove('open');
});

async function init(){
  await waitForFB();
  renderGenreButtons();
  buildSlider();
  document.getElementById('loading').classList.add('hidden');
  startMoviesListener();
}

document.body.addEventListener('click', () => initAudio(), { once: true });
init();
</script>
